[package]
name = "apiari-hive"
version = "0.5.1"
edition = "2024"
description = "Workspace chat hub — multi-bot, multi-provider AI assistant with swarm integration"
license = "MIT"
repository = "https://github.com/ApiariTools/hive"
keywords = ["ai", "chat", "workspace", "assistant"]
categories = ["command-line-utilities"]
include = ["src/**/*", "web/dist/**/*", "build.rs", "Cargo.toml", "README.md", "LICENSE", "tts/*.py", "tts/*.sh", "tts/*.txt", "hooks/**/*"]

[[bin]]
name = "hive"
path = "src/main.rs"

[workspace]

[dependencies]
axum = { version = "0.8", features = ["ws", "multipart"] }
chrono = { version = "0.4", features = ["serde"] }
croner = "3"
clap = { version = "4", features = ["derive"] }
color-eyre = "0.6"
futures-core = "0.3"
futures-util = "0.3"
rusqlite = { version = "0.34", features = ["bundled"] }
rust-embed = { version = "8", features = ["compression"] }
mime_guess = "2"
serde = { version = "1", features = ["derive"] }
apiari-claude-sdk = "0.2.0"
apiari-codex-sdk = "0.1.2"
apiari-gemini-sdk = "0.2.0"
async-stream = "0.3"
async-trait = "0.1"
serde_json = "1"
tokio = { version = "1", features = ["full", "test-util"] }
tokio-stream = { version = "0.1", features = ["io-util"] }
toml = "0.8"
apiari-swarm = { version = "0.1.7", default-features = false, features = ["client", "server"] }
tempfile = "3"
reqwest = { version = "0.12", features = ["json", "multipart"] }
tower-http = { version = "0.6", features = ["cors"] }
tokio-tungstenite = { version = "0.29", features = ["native-tls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tower = "0.5"
